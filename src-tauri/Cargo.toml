[package]
name = "hydra-dl"
version = "0.2.0"
description = "Cok baglantili, devam ettirilebilir indirme yoneticisi"
authors = ["TitanLion72"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "hydra_dl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "charset"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = "0.8"
url = "2"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1"
regex = "1"
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
qrcode = "0.14"
base64 = "0.22"
async-stream = "0.3"
mime_guess = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
