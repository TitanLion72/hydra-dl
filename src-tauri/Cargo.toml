[package]
name = "hydra-dl"
version = "0.3.9"
description = "Cok baglantili, devam ettirilebilir indirme yoneticisi"
authors = ["TitanLion72"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "hydra_dl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
notify-rust = "4.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "charset", "socks"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = "0.8"
# Web sunucusu icin istege bagli HTTPS (LAN'da token duz metin gitmesin).
axum-server = { version = "0.7", features = ["tls-rustls"] }
# rustls 0.23 CryptoProvider'i features'tan otomatik secemez: reqwest `aws-lc-rs`,
# rcgen `ring` getiriyor. Ikisi de acik olunca varsayilan kurulmadan panic atiyor
# (release profilinde `panic = "abort"` oldugu icin surec tamamen oluyordu).
# Cozum: acikca aws-lc-rs saglayicisini kur (reqwest zaten onu derliyor).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
url = "2"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1"
regex = "1"
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
qrcode = "0.14"
base64 = "0.22"
async-stream = "0.3"
mime_guess = "2"
# DASH (.mpd) manifest çözümü.
quick-xml = "0.41"
# HLS AES-128 sifre cozumu (DRM degil; standart HLS sifrelemesi).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
